name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Cancel in-progress runs for the same branch on new pushes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── TypeScript: lint, type-check, unit tests ────────────────────────────────
  ts-check:
    name: TS lint / typecheck / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  # ── Python: lint, type-check, unit tests ────────────────────────────────────
  py-check:
    name: Python lint / typecheck / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install Python dependencies
        run: cd python && uv pip install --system -e ".[dev]"

      - name: Lint (ruff)
        run: cd python && ruff check .

      - name: Type-check (mypy)
        run: cd python && mypy .

      - name: Unit tests (pytest)
        run: cd python && pytest

  # ── Dependency audit ─────────────────────────────────────────────────────────
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        # Fail on high-severity findings; moderate findings are reported but do not block.
        run: npm audit --audit-level=high

  # ── Licence check ───────────────────────────────────────────────────────────
  licence:
    name: Licence check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check licences
        # Allowed: common permissive licences compatible with AGPL-3.0.
        # Update this list when adding a dependency with a different compatible licence.
        run: npm run check:licenses

  # ── Secret scan ──────────────────────────────────────────────────────────────
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
