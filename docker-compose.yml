# MargHire docker-compose.yml
# Default: API + Web + Postgres. SQLite fallback: set DATABASE_URL to a file:// path in .env.
# Python helper (Laya, eval scripts): docker compose --profile python up

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      # Localhost only by default. See security checklist before exposing externally.
      - "127.0.0.1:3000:3000"
    environment:
      API_HOST: "0.0.0.0"
      API_PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:-postgres://marghire:marghire@db:5432/marghire}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - marghire_data:/data
    user: "1001:1001"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: marghire
      POSTGRES_PASSWORD: marghire
      POSTGRES_DB: marghire
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Exposed for local dev tools (e.g. a DB browser). Remove in production.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marghire -d marghire"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  python:
    build:
      context: .
      dockerfile: docker/Dockerfile.python
    profiles:
      - python
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://marghire:marghire@db:5432/marghire}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - marghire_data:/data
      - ./python:/app/python:ro
    user: "1001:1001"
    restart: unless-stopped

volumes:
  marghire_data:
  postgres_data:
