# MargHire docker-compose.yml
# Default: API + Web using SQLite in the named data volume.
# Python helper (Laya, eval scripts): docker compose --profile python up

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      # Localhost only by default. See security checklist before exposing externally.
      - "127.0.0.1:3000:3000"
    environment:
      API_HOST: "0.0.0.0"
      API_PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:-file:/data/marghire.db}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
    volumes:
      - marghire_data:/data
    user: "1001:1001"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api
    restart: unless-stopped

  python:
    build:
      context: .
      dockerfile: docker/Dockerfile.python
    profiles:
      - python
    environment:
      DATABASE_URL: ${DATABASE_URL:-file:/data/marghire.db}
    volumes:
      - marghire_data:/data
      - ./python:/app/python:ro
    user: "1001:1001"
    restart: unless-stopped

volumes:
  marghire_data:
