[project]
name = "marghire-python"
version = "0.0.1"
description = "MargHire Python helper: Laya sidecar, embeddings, evaluation scripts"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }

dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.9.0",
  "mypy>=1.11",
]

[project.scripts]
marghire-eval = "eval.run:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["eval"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
